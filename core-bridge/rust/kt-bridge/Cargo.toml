[package]
name = "kt-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "FFI bridge between temporal-kt (JVM) and the Temporal Rust SDK-Core"
publish = false

[lib]
name = "kt_bridge"
# rlib alongside cdylib so the safety-critical pieces (handle generations, panic
# containment, queue ordering) can be unit-tested rather than only exercised through the JVM.
crate-type = ["cdylib", "rlib"]

[dependencies]
# SDK-Core comes from crates.io. There is no submodule and no fork: everything the previous
# C-bridge fork patched is reachable through Core's public Rust API (see src/ephemeral.rs and
# src/worker.rs), so the patches are unnecessary rather than merely carried elsewhere.
temporalio-sdk-core = { version = "0.8", features = ["ephemeral-server", "otel"] }
temporalio-client = "0.8"
temporalio-common = { version = "0.8", features = ["core-based-sdk", "otel"] }

anyhow = "1"
# The same crate SDK-Core uses for this; $HOSTNAME is a shell variable, not an exported one,
# so reading the environment yields nothing on macOS and in most containers.
gethostname = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false }
parking_lot = "0.12"
prost = "0.14"
prost-types = { version = "0.7", package = "prost-wkt-types" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
tonic = { version = "0.14", default-features = false }
tracing = "0.1"
url = "2"

[build-dependencies]
prost-build = "0.14"

# Its own workspace: see the exclusion note in ../Cargo.toml.
[workspace]

[profile.release]
# The library ships on every consumer's classpath and its size was never watched: the C bridge
# reached 36.9 MB, 12.4 MB of it symbol tables. panic = "unwind" is mandatory, not stylistic --
# every entry point relies on catch_unwind (see src/panic.rs).
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
