syntax = "proto3";

package kt_bridge;

// Configuration crosses the ABI as protobuf rather than as #[repr(C)] structs.
//
// This is the main reason the JVM binding layer shrinks from 21,589 hand-maintained lines to a
// few hundred: WorkerOptions alone was 1,100 lines of Java MemoryLayout whose offsets had to be
// mirrored by hand, where a mistake compiled cleanly and corrupted memory. Protobuf is built for
// exactly this -- an unknown field is skipped, a missing field takes its default -- so adding an
// option becomes a field addition rather than a coordinated layout change in two languages.
// Config is not on any hot path; a few microseconds at construction is free.

message RuntimeOptions {
  TelemetryOptions telemetry = 1;
}

message TelemetryOptions {
  // Core's own logs are forwarded to the JVM as Log completions rather than written by Core.
  // Safe only because they land on a pump thread: calling SLF4J from a Rust callback thread is
  // the pattern that produced the fillInStackTrace crash.
  bool forward_logs = 1;
  // tracing filter, e.g. "WARN" or "temporal_sdk_core=DEBUG".
  string log_filter = 2;
  string metrics_prometheus_bind_address = 3;
  string metrics_otel_url = 4;
}

message RuntimeInfo {
  string core_version = 1;
  string prometheus_bind_address = 2;
}

message ServerLogLine {
  bool stderr = 1;
  string line = 2;
}

message LogRecord {
  string target = 1;
  string message = 2;
  string fields_json = 3;
}

message ClientOptions {
  string target_url = 1;
  string namespace = 2;
  string identity = 3;
  string client_name = 4;
  string client_version = 5;
  string api_key = 6;
  uint64 connect_timeout_millis = 7;
  // Negated so proto3's false default keeps Core's own default (gzip on).
  bool no_compression = 8;

  // TLS. `tls` alone means "TLS with the system roots" (an https:// target, an API key); the
  // remaining fields refine it. tonic refuses an https:// target with no TLS configuration at
  // all, so without this Temporal Cloud is unreachable.
  bool tls = 9;
  bytes server_root_ca_cert = 10;
  string tls_domain = 11;
  bytes client_cert = 12;
  bytes client_private_key = 13;
}

message WorkerOptions {
  string namespace = 1;
  string task_queue = 2;
  string identity = 3;
  uint32 max_cached_workflows = 4;
  // 0 means "let Core choose".
  uint32 max_concurrent_workflow_tasks = 5;
  uint32 max_concurrent_activities = 6;
  uint32 max_concurrent_local_activities = 7;
  bool no_remote_activities = 8;
  // Optional identifier; versioning itself is not wired through yet.
  string build_id = 9;

  // Resource-based tuning. Core shares one controller (and therefore one set of targets and
  // gains) across a worker's slot types, so the targets live here while each slot type carries
  // its own limits. A slot type with no limits stays fixed-size, so the three can be mixed.
  ResourceBasedTuner resource_tuner = 10;
  ResourceSlotLimits workflow_resource_limits = 11;
  ResourceSlotLimits activity_resource_limits = 12;
  ResourceSlotLimits local_activity_resource_limits = 13;

  // Negated so that proto3's false default means "enabled", matching no_remote_activities above
  // and WorkerConfig's own defaults.
  bool no_workflows = 14;
  bool no_local_activities = 15;
}

// Core's resource-based slot supplier, which hands out slots while memory and CPU are under
// target and holds them back when they are not.
//
// The previous bridge implemented this in the JVM: a PID controller and a resource monitor behind
// seven FFM upcalls on the path in front of every poll. Core's version is the same algorithm with
// the same default gains, so the only thing the JVM copy bought was the upcalls.
message ResourceBasedTuner {
  // Both in [0.0, 1.0].
  double target_memory_usage = 1;
  double target_cpu_usage = 2;

  // PID gains, always populated by the caller: the JVM's own defaults are Core's defaults, so
  // these are passed through as-is rather than treating 0.0 as "unset" -- 0.0 is a legitimate
  // gain, and i_gain's default is exactly that.
  double memory_p_gain = 3;
  double memory_i_gain = 4;
  double memory_d_gain = 5;
  double memory_output_threshold = 6;
  double cpu_p_gain = 7;
  double cpu_i_gain = 8;
  double cpu_d_gain = 9;
  double cpu_output_threshold = 10;
}

// Per-slot-type bounds for a resource-based supplier.
message ResourceSlotLimits {
  // Slots handed out regardless of resource pressure, and a hard ceiling.
  uint32 minimum_slots = 1;
  uint32 maximum_slots = 2;
  // Minimum wait between issuing slots once past minimum_slots, to stop burst allocation.
  uint64 ramp_throttle_millis = 3;
}

// How long shutdown waits for in-flight tasks before finalizing anyway.
message WorkerShutdownOptions {
  uint64 grace_millis = 1;
}

message EphemeralServerOptions {
  // Either an existing binary, or a cached download.
  string existing_path = 1;
  string download_version = 2;   // "default" or "vX.Y.Z"
  string download_dest_dir = 3;
  string sdk_name = 4;
  string sdk_version = 5;

  string namespace = 6;
  string ip = 7;
  uint32 port = 8;
  bool ui = 9;
  repeated string extra_args = 10;
  // Time-skipping test server instead of the dev server.
  bool test_server = 11;
  // Where the child's output goes. Empty means discard. Never the JVM's own stdio: an
  // orphaned child holding that is what hangs a Gradle build after the tests have passed.
  string log_file = 12;
}

message EphemeralServerInfo {
  string target = 1;
  // OS pid of the child. The C bridge needed a fork patch to expose this; it is public Rust API.
  uint32 pid = 2;
  bool has_test_service = 3;
}
