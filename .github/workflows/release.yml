name: Release to Maven Central

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use gradle.properties version)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Publishing needs four repository secrets. Without them the publish step fails only after the
  # 30-minute native matrix has run, so check first and skip the whole workflow cleanly instead.
  # `secrets` is not available to a job-level `if`, hence a preflight job with an output.
  preflight:
    name: Check publishing credentials
    runs-on: ubuntu-latest
    outputs:
      can-publish: ${{ steps.check.outputs.can-publish }}
    steps:
      - id: check
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$OSSRH_USERNAME" ] && [ -n "$SIGNING_KEY" ]; then
            echo "can-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can-publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping publish: set OSSRH_USERNAME, OSSRH_TOKEN, SIGNING_KEY and SIGNING_PASSWORD to enable it."
          fi

  build-native:
    name: Build native (${{ matrix.platform }})
    needs: [preflight]
    if: needs.preflight.outputs.can-publish == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every Linux flavour is cross-compiled with zig on its own ubuntu runner: gnu against a
          # pinned glibc floor (see glibcFloor in core-bridge/build.gradle.kts), musl for Alpine.
          # Building on the runner's own glibc produced libraries that would not load on
          # Debian 12 / Ubuntu 22.04 / RHEL 9. One entry per target rather than one runner doing
          # all four in series: four release builds back to back ran past the job timeout.
          - os: ubuntu-24.04
            platform: linux-x86_64-gnu
            rust-targets: x86_64-unknown-linux-gnu
            gradle-task: copyNativeLibLinuxx8664
            artifact-name: native-libs-linux-x86_64-gnu
            artifact-path: core-bridge/build/native-libs/native/linux-x86_64-gnu
            expected-libs: 1
            zig: true
          - os: ubuntu-24.04
            platform: linux-aarch64-gnu
            rust-targets: aarch64-unknown-linux-gnu
            gradle-task: copyNativeLibLinuxAarch64
            artifact-name: native-libs-linux-aarch64-gnu
            artifact-path: core-bridge/build/native-libs/native/linux-aarch64-gnu
            expected-libs: 1
            zig: true
          - os: ubuntu-24.04
            platform: linux-x86_64-musl
            rust-targets: x86_64-unknown-linux-musl
            gradle-task: copyNativeLibLinuxx8664Musl
            artifact-name: native-libs-linux-x86_64-musl
            artifact-path: core-bridge/build/native-libs/native/linux-x86_64-musl
            expected-libs: 1
            zig: true
          - os: ubuntu-24.04
            platform: linux-aarch64-musl
            rust-targets: aarch64-unknown-linux-musl
            gradle-task: copyNativeLibLinuxAarch64Musl
            artifact-name: native-libs-linux-aarch64-musl
            artifact-path: core-bridge/build/native-libs/native/linux-aarch64-musl
            expected-libs: 1
            zig: true
          - os: macos-14
            platform: macos-aarch64
            rust-targets: aarch64-apple-darwin
            gradle-task: copyMacosAarch64NativeLib
            artifact-name: native-libs-macos-aarch64
            artifact-path: core-bridge/build/native-libs/native/macos-aarch64
            expected-libs: 1
          - os: windows-latest
            platform: windows-x86_64
            rust-targets: x86_64-pc-windows-msvc
            gradle-task: copyWindowsNativeLib
            artifact-name: native-libs-windows
            artifact-path: core-bridge/build/native-libs/native/windows-x86_64
            expected-libs: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Cache native library
        id: native-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.artifact-path }}
          key: native-${{ matrix.platform }}-${{ hashFiles('core-bridge/rust/kt-bridge/Cargo.lock', 'core-bridge/rust/kt-bridge/rust-toolchain.toml', 'core-bridge/rust/kt-bridge/src/**') }}
      - uses: actions/setup-java@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          java-version: '25'
          distribution: 'graalvm'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          toolchain: stable
          target: ${{ matrix.rust-targets }}
          cache-workspaces: "core-bridge/rust -> target"
          cache-all-crates: true
          cache-on-failure: true
          rustflags: ""
      - name: Install protobuf (Linux)
        if: steps.native-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install zig + cargo-zigbuild (Linux cross builds)
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.zig
        run: pip3 install --user cargo-zigbuild && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # From inside the crate directory on purpose: that is where rust-toolchain.toml pins the
      # compiler, and `rustup target add` installs a target's std for whichever toolchain is
      # active. Run from the repo root it would land on `stable`, and the pinned toolchain would
      # then fail every cross build with "can't find crate for `core`".
      - name: Install cross targets for the pinned toolchain
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.zig
        working-directory: core-bridge/rust/kt-bridge
        run: rustup target add $(echo "${{ matrix.rust-targets }}" | tr ',' ' ')
      - name: Install protobuf (macOS)
        if: steps.native-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf (Windows)
        if: steps.native-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
      - name: Build native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./gradlew :core-bridge:${{ matrix.gradle-task }} --no-daemon

      # A Copy task whose source is missing is a silent no-op in Gradle, and a cargo build that
      # writes somewhere unexpected then yields a green job with no artifact -- which is exactly
      # what CARGO_TARGET_DIR=C:\t did here before it was removed. Fail loudly instead.
      - name: Verify native library was produced
        shell: bash
        run: |
          set -euo pipefail
          count=$(find "${{ matrix.artifact-path }}" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) 2>/dev/null | wc -l)
          if [ "$count" -ne "${{ matrix.expected-libs }}" ]; then
            echo "ERROR: expected ${{ matrix.expected-libs }} native libraries in ${{ matrix.artifact-path }}, found $count"
            ls -laR "${{ matrix.artifact-path }}" 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          find "${{ matrix.artifact-path }}" -type f -exec ls -la {} +

      # The floor is only real if something checks it. A gnu library must need nothing newer than
      # the pinned glibc, and a musl library must need no glibc symbol at all -- otherwise a
      # future toolchain or dependency bump quietly ships a library that fails to load on the
      # distributions the floor exists for.
      - name: Verify glibc floor
        if: matrix.zig
        shell: bash
        run: |
          set -euo pipefail
          floor=$(grep -oE 'val glibcFloor = "[0-9.]+"' core-bridge/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+')
          echo "pinned glibc floor: $floor"
          fail=0
          for so in $(find "${{ matrix.artifact-path }}" -name '*.so' -path '*-gnu/*'); do
            need=$(objdump -T "$so" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -t. -k1,1n -k2,2n -u | tail -1)
            echo "$so needs glibc $need"
            if [ "$(printf '%s\n%s\n' "$floor" "$need" | sort -t. -k1,1n -k2,2n | tail -1)" != "$floor" ]; then
              echo "ERROR: $so requires GLIBC_$need, above the floor $floor"; fail=1
            fi
          done
          for so in $(find "${{ matrix.artifact-path }}" -name '*.so' -path '*-musl/*'); do
            if objdump -T "$so" | grep -q 'GLIBC_'; then
              echo "ERROR: musl library $so references glibc symbols"; fail=1
            fi
            echo "$so: no glibc symbols (musl)"
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 1

  publish:
    name: Publish to Maven Central
    needs: [preflight, build-native]
    if: needs.preflight.outputs.can-publish == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release asset uploads
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: gradle/actions/setup-gradle@v4

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          pattern: native-libs-*
          path: /tmp/natives
      - name: Place native libs
        run: |
          set -euo pipefail
          declare -A MAP=(
            [native-libs-linux-x86_64-gnu]=linux-x86_64-gnu
            [native-libs-linux-aarch64-gnu]=linux-aarch64-gnu
            [native-libs-linux-x86_64-musl]=linux-x86_64-musl
            [native-libs-linux-aarch64-musl]=linux-aarch64-musl
            [native-libs-macos-aarch64]=macos-aarch64
            [native-libs-windows]=windows-x86_64
          )
          for name in "${!MAP[@]}"; do
            dest="core-bridge/build/native-libs/native/${MAP[$name]}"
            mkdir -p "$dest"
            cp -v /tmp/natives/"$name"/* "$dest"/
          done
          find core-bridge/build/native-libs -type f | sort

      # Anchored so it cannot start matching sdkCoreVersion= or any future *version= property.
      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Publishing version: $VERSION"
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties
      - name: Set version from input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: sed -i "s/^version=.*/version=${{ inputs.version }}/" gradle.properties

      - name: Build JARs
        run: |
          ./gradlew jar \
            :core-bridge:linuxx8664gnuNativeJar \
            :core-bridge:linuxaarch64gnuNativeJar \
            :core-bridge:linuxx8664muslNativeJar \
            :core-bridge:linuxaarch64muslNativeJar \
            :core-bridge:macosaarch64NativeJar \
            :core-bridge:windowsx8664NativeJar \
            -PskipNativeBuild=true --no-daemon

      - name: Verify JAR contents
        run: |
          set -euo pipefail

          # The main JAR must never carry natives -- consumers pick a classifier.
          MAIN_JAR=$(ls core-bridge/build/libs/core-bridge-*.jar \
            | grep -Ev -- '-(linux|macos|windows)|-sources|-javadoc|-native-host' | head -1)
          echo "main JAR: $MAIN_JAR"
          if unzip -l "$MAIN_JAR" | grep -qE ' native/'; then
            echo "ERROR: main JAR contains native libraries"; exit 1
          fi
          # Protos moved to their own artifact; re-adding the srcDirs here would silently
          # duplicate ~6,500 classes into the bridge JAR.
          if unzip -l "$MAIN_JAR" | grep -qE ' (io/temporal/api|coresdk)/'; then
            echo "ERROR: main JAR contains generated proto classes"; exit 1
          fi
          echo "OK: main JAR is clean"

          # Each classifier JAR must hold exactly one library, under the expected platform dir,
          # and be large enough to be real. An empty or mis-copied classifier JAR would otherwise
          # publish silently and fail only at a user's runtime.
          check() {
            local jar="$1" platform="$2"
            [ -f "$jar" ] || { echo "ERROR: missing $jar"; exit 1; }
            local n
            n=$(unzip -Z1 "$jar" | grep -cE "^native/${platform}/[^/]+$")
            [ "$n" -eq 1 ] || { echo "ERROR: $jar has $n libs under native/$platform/"; unzip -Z1 "$jar"; exit 1; }
            local bytes
            bytes=$(stat -c%s "$jar")
            [ "$bytes" -gt 1000000 ] || { echo "ERROR: $jar is only $bytes bytes"; exit 1; }
            echo "OK: $(basename "$jar") -> native/$platform ($bytes bytes)"
          }
          V=$(ls core-bridge/build/libs/ | grep -oE 'core-bridge-.*-macos-aarch64\.jar' | sed 's/core-bridge-//; s/-macos-aarch64\.jar//')
          for p in linux-x86_64-gnu linux-aarch64-gnu linux-x86_64-musl linux-aarch64-musl macos-aarch64 windows-x86_64; do
            check "core-bridge/build/libs/core-bridge-$V-$p.jar" "$p"
          done

      # Credentials go through ORG_GRADLE_PROJECT_* environment variables, not -P flags. The
      # armored PGP key is multi-line, and a multi-line value does not survive being interpolated
      # into a shell command line -- it rendered across 109 lines and Gradle failed with
      # "Could not evaluate spec for 'Signing is required, or signatory is set'", i.e. no
      # signatory was parsed. Environment variables carry newlines intact, and this is the form
      # the plugin documents.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN }}
        run: |
          ./gradlew publishToMavenCentral \
            -PskipNativeBuild=true \
            --no-configuration-cache --no-daemon

      - name: Upload artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core-bridge/build/libs/*.jar
            core-common/build/libs/*.jar
            protos/build/libs/*.jar
