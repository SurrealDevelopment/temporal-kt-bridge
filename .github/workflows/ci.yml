name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # kt-bridge pins its own toolchain in rust-toolchain.toml. Reading the pin rather than
      # floating `stable` keeps `-D warnings` reproducible: a newer clippy introduces lints the
      # pinned compiler has never had to satisfy, which turns an unrelated PR red.
      - name: Read pinned Rust toolchain
        id: toolchain
        run: |
          CHANNEL=$(grep -oP 'channel\s*=\s*"\K[^"]+' core-bridge/rust/kt-bridge/rust-toolchain.toml)
          echo "Pinned toolchain: $CHANNEL"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
          cache-workspaces: "core-bridge/rust/kt-bridge -> target"
          cache-all-crates: true
          rustflags: ""
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: clippy (kt-bridge)
        working-directory: core-bridge/rust/kt-bridge
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test (kt-bridge)
        working-directory: core-bridge/rust/kt-bridge
        run: cargo test --locked

      # Enforces what panic.rs claims: no entry point may bypass the kt_export! macro, which is
      # the only thing keeping a panic from aborting the host JVM. kt_abi_probe and kt_last_error
      # are the two documented exemptions; both are infallible by construction.
      - name: every FFI entry point is panic-contained
        working-directory: core-bridge/rust/kt-bridge
        run: |
          set -euo pipefail
          bare=$(grep -rn 'extern "C"' src/ \
                  | grep -v 'macro_rules' \
                  | grep -v 'kt_abi_probe' \
                  | grep -v 'kt_last_error' \
                  | grep -v '^src/panic.rs' || true)
          if [ -n "$bare" ]; then
            echo "ERROR: extern \"C\" outside kt_export! (a panic here aborts the JVM):"
            echo "$bare"
            exit 1
          fi
          echo "OK: all entry points go through kt_export!"

  build-native:
    name: Build native (${{ matrix.platform }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # All four Linux flavours are cross-compiled with zig from this one runner: gnu against a
          # pinned glibc floor (see glibcFloor in core-bridge/build.gradle.kts), and musl for
          # Alpine. Building on the runner's own glibc produced libraries that would not load on
          # Debian 12 / Ubuntu 22.04 / RHEL 9.
          - os: ubuntu-24.04
            platform: linux
            rust-targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
            gradle-task: copyLinuxNativeLibs
            artifact-name: native-libs-linux
            artifact-path: core-bridge/build/native-libs/native
            expected-libs: 4
            zig: true
          - os: macos-14
            platform: macos-aarch64
            rust-targets: aarch64-apple-darwin
            gradle-task: copyMacosAarch64NativeLib
            artifact-name: native-libs-macos-aarch64
            artifact-path: core-bridge/build/native-libs/native/macos-aarch64
            expected-libs: 1
          - os: windows-latest
            platform: windows-x86_64
            rust-targets: x86_64-pc-windows-msvc
            gradle-task: copyWindowsNativeLib
            artifact-name: native-libs-windows
            artifact-path: core-bridge/build/native-libs/native/windows-x86_64
            expected-libs: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache native library
        id: native-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.artifact-path }}
          # rust-toolchain.toml is part of the key: it pins the compiler, so a change to it
          # changes the produced library.
          key: native-${{ matrix.platform }}-${{ hashFiles('core-bridge/rust/kt-bridge/Cargo.lock', 'core-bridge/rust/kt-bridge/rust-toolchain.toml', 'core-bridge/rust/kt-bridge/src/**') }}

      - uses: actions/setup-java@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          java-version: '25'
          distribution: 'graalvm'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          toolchain: stable
          target: ${{ matrix.rust-targets }}
          cache-workspaces: "core-bridge/rust -> target"
          cache-all-crates: true
          cache-on-failure: true
          rustflags: ""
      - name: Install protobuf (Linux)
        if: steps.native-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install zig + cargo-zigbuild (Linux cross builds)
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.zig
        run: pip3 install --user cargo-zigbuild && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # From inside the crate directory on purpose: that is where rust-toolchain.toml pins the
      # compiler, and `rustup target add` installs a target's std for whichever toolchain is
      # active. Run from the repo root it would land on `stable`, and the pinned toolchain would
      # then fail every cross build with "can't find crate for `core`".
      - name: Install cross targets for the pinned toolchain
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.zig
        working-directory: core-bridge/rust/kt-bridge
        run: rustup target add $(echo "${{ matrix.rust-targets }}" | tr ',' ' ')
      - name: Install protobuf (macOS)
        if: steps.native-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf (Windows)
        if: steps.native-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
      - name: Build native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./gradlew :core-bridge:${{ matrix.gradle-task }} --no-daemon


      # A Copy task whose source is missing is a silent no-op in Gradle, and a cargo build that
      # writes somewhere unexpected then yields a green job with no artifact -- which is exactly
      # what CARGO_TARGET_DIR=C:\t did here before it was removed. Fail loudly instead.
      - name: Verify native library was produced
        shell: bash
        run: |
          set -euo pipefail
          count=$(find "${{ matrix.artifact-path }}" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) 2>/dev/null | wc -l)
          if [ "$count" -ne "${{ matrix.expected-libs }}" ]; then
            echo "ERROR: expected ${{ matrix.expected-libs }} native libraries in ${{ matrix.artifact-path }}, found $count"
            ls -laR "${{ matrix.artifact-path }}" 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          find "${{ matrix.artifact-path }}" -type f -exec ls -la {} +

      # The floor is only real if something checks it. A gnu library must need nothing newer than
      # the pinned glibc, and a musl library must need no glibc symbol at all -- otherwise a
      # future toolchain or dependency bump quietly ships a library that fails to load on the
      # distributions the floor exists for.
      - name: Verify glibc floor
        if: matrix.zig
        shell: bash
        run: |
          set -euo pipefail
          floor=$(grep -oE 'val glibcFloor = "[0-9.]+"' core-bridge/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+')
          echo "pinned glibc floor: $floor"
          fail=0
          for so in $(find "${{ matrix.artifact-path }}" -name '*.so' -path '*-gnu/*'); do
            need=$(objdump -T "$so" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -t. -k1,1n -k2,2n -u | tail -1)
            echo "$so needs glibc $need"
            if [ "$(printf '%s\n%s\n' "$floor" "$need" | sort -t. -k1,1n -k2,2n | tail -1)" != "$floor" ]; then
              echo "ERROR: $so requires GLIBC_$need, above the floor $floor"; fail=1
            fi
          done
          for so in $(find "${{ matrix.artifact-path }}" -name '*.so' -path '*-musl/*'); do
            if objdump -T "$so" | grep -q 'GLIBC_'; then
              echo "ERROR: musl library $so references glibc symbols"; fail=1
            fi
            echo "$so: no glibc symbols (musl)"
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 1

  jvm-test:
    name: JVM test (${{ matrix.platform }})
    needs: [build-native]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64-gnu
            artifact-name: native-libs-linux
            artifact-path: core-bridge/build/native-libs/native
            experimental: false
          - os: ubuntu-24.04-arm
            platform: linux-aarch64-gnu
            artifact-name: native-libs-linux
            artifact-path: core-bridge/build/native-libs/native
            experimental: false
          - os: macos-14
            platform: macos-aarch64
            artifact-name: native-libs-macos-aarch64
            artifact-path: core-bridge/build/native-libs/native/macos-aarch64
            expected-libs: 1
            experimental: false
          # Windows was disabled in temporal-kt because the 30-minute cargo build made it
          # unreliable. That cost is gone here (the native is a downloaded artifact), so it runs
          # again -- non-blocking until it has a track record.
          - os: windows-latest
            platform: windows-x86_64
            artifact-name: native-libs-windows
            artifact-path: core-bridge/build/native-libs/native/windows-x86_64
            expected-libs: 1
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'
      - name: Install protobuf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
      - name: Build and test
        run: ./gradlew build -PskipNativeBuild=true --no-daemon
      # A crash in a native call kills the JVM and Gradle reports nothing useful, so keep the
      # forensics.
      - name: Upload crash logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs-${{ matrix.platform }}
          path: |
            **/hs_err_pid*.log
            **/replay_pid*.log
          if-no-files-found: ignore
